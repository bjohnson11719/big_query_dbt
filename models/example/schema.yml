
version: 2

models:
    - name: customer_summary
      description: "Creates a table that summarizes customer data"
      columns:
          - name: id
            description: "The primary key for this table"
          - name: customer_id
            description: "customer id"
          - name: first_name
            description: "customer first name"
          - name: last_name
            description: "customer last name"
          - name: first_order_date
            description: "customer first order date"
          - name: most_recent_order_date
            description: "customer most recent order date"
          - name: number_of_orders
            description: "total number of orders for customer"

    - name: order_view
      description: "Creates an order view"
      columns:
          - name: id
            description: "The primary key for this table"
          - name: order_id
            description: "order id"
          - name: customer_id
            description: "customer id"
          - name: order_date
            description: "order date"
          - name: status
            description: "order status"